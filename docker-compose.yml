services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: propel
      POSTGRES_USER: propel
      POSTGRES_PASSWORD: propel
    ports:
      - "5432:5432"
    volumes:
      - propel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propel -d propel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: propel
      MINIO_ROOT_PASSWORD: propelpropel
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - propel_minio:/data
    profiles: ["storage"]

volumes:
  propel_pg:
  propel_minio:
